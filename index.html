<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭФИР // ROULETTE</title>
    <style>
        :root {
            --bg-color: #0d0d0f;
            --panel-bg: #16161a;
            --cyan: #00ffcc;
            --pink: #ff007f;
            --red: #ff3333;
            --text-main: #e0e0e0;
            --text-dim: #707080;
            --border: #2a2a35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* VHS Scanlines effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 2;
        }

        header {
            text-align: center;
            border-bottom: 2px dashed var(--border);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 2px 2px var(--pink);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .status-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #09090c;
            padding: 12px 15px;
            border: 1px solid var(--border);
        }

        .status-text {
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            background-color: var(--text-dim);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--text-dim);
            transition: 0.3s;
        }

        .indicator.active {
            background-color: var(--cyan);
            box-shadow: 0 0 12px var(--cyan);
        }

        .indicator.searching {
            background-color: var(--pink);
            box-shadow: 0 0 12px var(--pink);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .modes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .mode-btn {
            background: #09090c;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 10px 5px;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
            text-align: center;
        }

        .mode-btn.selected {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(0, 255, 204, 0.05);
        }

        .action-btn {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 15px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .action-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .action-btn.skip {
            background: var(--pink);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .action-btn.skip:hover {
            background: #fff;
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 150px;
            overflow-y: auto;
            background: #09090c;
            border: 1px solid var(--border);
            padding: 10px;
            font-size: 0.85rem;
        }

        .chat-message {
            word-break: break-all;
        }

        .chat-message.system {
            color: var(--text-dim);
            font-style: italic;
        }

        .chat-input-area {
            display: flex;
            gap: 5px;
        }

        .chat-input {
            flex: 1;
            background: #09090c;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px;
            font-family: inherit;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--cyan);
        }

        .stats-panel {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>// ЭФИР_</h1>
            <div class="subtitle">ANONYMOUS AUDIO ROULETTE v1.0</div>
        </header>

        <div class="panel">
            <div class="status-box">
                <span id="statusText" class="status-text">ОЖИДАНИЕ СЕАНСА</span>
                <div id="statusIndicator" class="indicator"></div>
            </div>

            <div id="modesContainer" class="modes">
                <button class="mode-btn selected" data-mode="general">Общий</button>
                <button class="mode-btn" data-mode="flirt">Флирт</button>
                <button class="mode-btn" data-mode="adult">18+</button>
            </div>

            <button id="mainBtn" class="action-btn">НАЧАТЬ ПОИСК</button>
            <button id="skipBtn" class="action-btn skip hidden">СЛЕДУЮЩИЙ</button>

            <div id="chatSection" class="hidden">
                <div id="chatBox" class="chat-container">
                    <div class="chat-message system">Соединение установлено. Вы можете общаться голосом или текстом.</div>
                </div>
                <div class="chat-input-area" style="margin-top: 10px;">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Введите сообщение...">
                    <button id="sendBtn" class="action-btn" style="padding: 8px 15px; font-size: 0.8rem;">SEND</button>
                </div>
            </div>

            <div class="stats-panel">
                <span id="onlineCount">ONLINE: 0</span>
                <span id="pingDisplay">PING: -- ms</span>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // КОНФИГУРАЦИЯ WEBRTC (ВКЛЮЧАЯ СИЛЬНЫЕ TURN-СЕРВЕРЫ ДЛЯ МОБИЛЬНЫХ СЕТЕЙ)
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stunprotocol.org:3478' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]
        };

        const socket = io({
            query: {
                token: localStorage.getItem('audio_roulette_token') || generateToken(),
                wasInCall: localStorage.getItem('audio_roulette_in_call') === 'true'
            }
        });

        function generateToken() {
            const token = 'user_' + Math.random().toString(36.25) + Date.now().toString(36);
            localStorage.setItem('audio_roulette_token', token);
            return token;
        }

        let currentMode = 'general';
        let localStream = null;
        let peerConnection = null;
        let currentRoom = null;
        let isInitiator = false;
        let ignoredPartners = [];
        let pingInterval = null;

        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const modesContainer = document.getElementById('modesContainer');
        const mainBtn = document.getElementById('mainBtn');
        const skipBtn = document.getElementById('skipBtn');
        const chatSection = document.getElementById('chatSection');
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const onlineCount = document.getElementById('onlineCount');
        const pingDisplay = document.getElementById('pingDisplay');

        // Выбор режима
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                currentMode = e.target.dataset.mode;
            });
        });

        mainBtn.addEventListener('click', () => {
            startSearch();
        });

        skipBtn.addEventListener('click', () => {
            leaveRoom();
            startSearch();
        });

        function startSearch() {
            statusText.textContent = 'ПОИСК ВОЛНЫ...';
            statusIndicator.className = 'indicator searching';
            mainBtn.classList.add('hidden');
            modesContainer.classList.add('hidden');
            
            socket.emit('find_partner', { mode: currentMode, ignored: ignoredPartners });
        }

        function leaveRoom() {
            if (currentRoom) {
                socket.emit('leave_room');
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                currentRoom = null;
            }
            stopPingCheck();
            skipBtn.classList.add('hidden');
            mainBtn.classList.remove('hidden');
            modesContainer.classList.remove('hidden');
            chatSection.classList.add('hidden');
            statusText.textContent = 'ОЖИДАНИЕ СЕАНСА';
            statusIndicator.className = 'indicator';
            localStorage.setItem('audio_roulette_in_call', 'false');
        }

        socket.on('online', (count) => {
            onlineCount.textContent = `ONLINE: ${count}`;
        });

        socket.on('waiting', () => {
            statusText.textContent = 'ПОИСК СОБЕСЕДНИКА...';
            statusIndicator.className = 'indicator searching';
        });

        socket.on('matched', async (data) => {
            currentRoom = data.room;
            isInitiator = data.initiator;
            ignoredPartners.push(data.partnerId);

            statusText.textContent = 'СЕАНС УСТАНОВЛЕН';
            statusIndicator.className = 'indicator active';
            mainBtn.classList.add('hidden');
            skipBtn.classList.remove('hidden');
            chatSection.classList.remove('hidden');
            localStorage.setItem('audio_roulette_in_call', 'true');

            appendSystemMessage('Собеседник найден. Подключение...');
            await initWebRTC();
        });

        socket.on('session_restored', async (data) => {
            currentRoom = data.room;
            isInitiator = data.initiator;

            statusText.textContent = 'СЕАНС ВОССТАНОВЛЕН';
            statusIndicator.className = 'indicator active';
            mainBtn.classList.add('hidden');
            skipBtn.classList.remove('hidden');
            chatSection.classList.remove('hidden');

            appendSystemMessage('Сеанс успешно восстановлен.');
            await initWebRTC();
        });

        socket.on('session_failed', () => {
            localStorage.setItem('audio_roulette_in_call', 'false');
            leaveRoom();
        });

        socket.on('partner_left', () => {
            appendSystemMessage('Собеседник покинул эфир.');
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            stopPingCheck();
            setTimeout(() => {
                leaveRoom();
                startSearch();
            }, 1500);
        });

        // WebRTC логика
        async function initWebRTC() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                appendSystemMessage('Ошибка доступа к микрофону!');
                return;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                const remoteAudio = document.createElement('audio');
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.autoplay = true;
                document.body.appendChild(remoteAudio);
                startPingCheck();
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', { room: currentRoom, signal: { candidate: event.candidate } });
                }
            };

            if (isInitiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('signal', { room: currentRoom, signal: { sdp: peerConnection.localDescription } });
            }
        }

        socket.on('signal', async (data) => {
            if (!peerConnection) return;

            if (data.signal.sdp) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                if (data.signal.sdp.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('signal', { room: currentRoom, signal: { sdp: peerConnection.localDescription } });
                }
            } else if (data.signal.candidate) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                } catch (e) {
                    console.error('Ошибка добавления ICE кандидата', e);
                }
            }
        });

        function startPingCheck() {
            clearInterval(pingInterval);
            pingInterval = setInterval(async () => {
                if (!peerConnection) return;
                try {
                    const stats = await peerConnection.getStats();
                    stats.forEach(report => {
                        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                            const rtt = Math.round(report.currentRoundTripTime * 1000);
                            pingDisplay.textContent = `PING: ${rtt}ms`;
                        }
                    });
                } catch(e) {}
            }, 2000);
        }

        function stopPingCheck() {
            clearInterval(pingInterval);
            pingDisplay.textContent = 'PING: -- ms';
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'chat-message system';
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
